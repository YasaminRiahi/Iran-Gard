version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: iran-gard-postgres-${ENVIRONMENT:-dev}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-iran-gard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iran-gard-backend-${ENVIRONMENT:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
    env_file:
      - backend/.env.${ENVIRONMENT:-dev}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Development only: mount volumes for live reload
    ${DEV_VOLUMES:-}

volumes:
  postgres_data:
