server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    
    server_name _;
    
    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/certificate.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Trust X-Forwarded-For header from Cloudflare
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # External Redirect for .html files (e.g. trips.html?id=1 -> /trips?id=1)
    if ($request_uri ~ ^/(.*)\.html(\?|$)) {
        return 301 /$1$is_args$args;
    }

    location = /favicon.ico {
        alias /src/assets/images/website-icon.png; 
        access_log off;
        log_not_found off;
        expires 1w;
        add_header Cache-Control "public";
    }

location ^~ /static/ {
    # This rewrites /static/image.jpg to /api/static/image.jpg
    proxy_pass http://backend:8000/api$request_uri;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Optional: Add caching for images to reduce backend load
    expires 7d;
    add_header Cache-Control "public, no-transform";
}

# Handle the /places/static/ prefix and forward to the backend static path
location ^~ /places/static/ {
    # This rewrite removes '/places' and passes '/static/...' to the backend
    proxy_pass http://backend:8000/api/static/;
    
    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $host;

    # Browser caching for images
    expires 30d;
    add_header Cache-Control "public, no-transform";
}


location ^~ /trips/static/ {
    # This specifically strips '/trips/static/' and replaces it with '/api/static/'
    proxy_pass http://backend:8000/api/static/;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}


location ~* /static/(.*) {
    # This takes everything after 'static/' and appends it to your backend API path
    proxy_pass http://backend:8000/api/static/$1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Performance: Cache these images for 30 days
    expires 30d;
    add_header Cache-Control "public, no-transform";
}
location ~* /static/(.*)$ {
    # It captures everything starting from 'static/' and forwards it to the backend
    # Example: /trips/static/images/1.jpg -> http://backend:8000/api/static/images/1.jpg
    proxy_pass http://backend:8000/api/static/$1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Basic caching to speed up image loading
    expires 30d;
    add_header Cache-Control "public, no-transform";
}

    # Proxy API requests to backend
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_redirect http:// https://;
    }

    # Cache static assets for 15 minutes (client and CDN)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 15m;
        add_header Cache-Control "public, max-age=900, s-maxage=900";
    }

    # No caching for HTML files (for SPA routing)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Clean URLs (Tries file -> then file.html -> then directory -> then index)
    location / {
        try_files $uri $uri.html $uri/ /index.html$is_args$args;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
