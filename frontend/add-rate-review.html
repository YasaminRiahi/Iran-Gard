<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نظر و امتیاز</title>
    <link rel="stylesheet" href="src/styles/pages/add-rate-review.css" media="screen">
    <link rel="stylesheet" href="src/styles/responsive/add-rate-review-responsive.css" media="screen">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <script type="module" src="src/scripts/services/add-rate-review.js"></script>
</head>

<body>
    <div class="background-animation"></div>

    <div class="container">
        <div class="review-card">
            <div class="card-header">
                <button class="back-btn" id="backBtn">
                    <i class="fas fa-arrow-right back-icon"></i>
                    بازگشت
                </button>
                <div>
                    <br>
                    <br>
                    <br>
                </div>
                <h1 class="card-title">ثبت نظر و امتیاز</h1>
                <p class="card-subtitle">تجربه خود را با ما به اشتراک بگذارید</p>
            </div>

            <form id="reviewForm" class="review-form">
                <div class="rating-section">
                    <h3 class="section-title">
                        <i class="fas fa-star title-icon"></i>
                        امتیاز شما
                    </h3>

                    <div class="rating-container">
                        <div class="rating-stars">
                            <div class="stars-wrapper">
                                <i class="star fas fa-star" data-rating="1"></i>
                                <i class="star fas fa-star" data-rating="2"></i>
                                <i class="star fas fa-star" data-rating="3"></i>
                                <i class="star fas fa-star" data-rating="4"></i>
                                <i class="star fas fa-star" data-rating="5"></i>
                            </div>
                            <div class="rating-display" dir="ltr">
                                <span class="rating-value" id="ratingValueDisplay">0</span>
                                <span class="rating-separator">/</span>
                                <span class="rating-max">5</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="comment-section">
                    <h3 class="section-title">
                        <i class="fas fa-comment title-icon"></i>
                        نظر شما
                    </h3>

                    <div class="textarea-container">
                        <textarea id="comment" class="comment-textarea" rows="5"
                            placeholder="تجربه‌ت رو از این مکان بنویس…"></textarea>

                        <div class="textarea-footer">
                            <div class="char-counter">
                                <i class="fas fa-text-height counter-icon"></i>
                                <span id="charCount">0</span> / 300
                            </div>
                        </div>
                    </div>
                </div>

                <div class="submit-section">
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span class="btn-text">ثبت نظر</span>
                        <div class="btn-icon-wrapper">
                            <i class="fas fa-paper-plane btn-icon"></i>
                            <div class="btn-pulse"></div>
                        </div>
                    </button>

                    <div class="submit-info">
                        <i class="fas fa-user-check info-icon"></i>
                        <span>شما با نام کاربری <strong></strong> وارد شده‌اید</span>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
